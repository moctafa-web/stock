<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ONE MOBILE - ستوك المحل</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ONE MOBILE">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Cairo", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #111827 100%);
      color: #fff;
      min-height: 100vh;
      padding: 16px;
    }

    .container { max-width: 1400px; margin: auto; }

    /* HEADER */
    .header {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }

    .header-top {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 16px;
    }

    .header-title {
      display: flex; align-items: center; gap: 12px;
    }

    .logo {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }

    .header h1 { font-size: 22px; font-weight: 800; line-height: 1.2; }
    .header h1 span {
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block; font-size: 14px;
    }

    .header-buttons {
      display: flex; gap: 8px; flex-wrap: wrap;
    }

    .btn {
      border: none; color: white; padding: 11px 18px;
      border-radius: 12px; cursor: pointer;
      font-family: "Cairo"; font-weight: 700; font-size: 13px;
      display: flex; align-items: center; gap: 6px;
      transition: 0.3s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.6; cursor: wait; }

    .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }

    .last-update { color: #94a3b8; font-size: 13px; margin-bottom: 14px; }

    /* SEARCH */
    .search-box { position: relative; margin-bottom: 14px; }
    .search-box input {
      width: 100%; padding: 14px 18px;
      border-radius: 14px; border: 2px solid rgba(255,255,255,0.1);
      outline: none; background: rgba(255,255,255,0.08);
      color: white; font-size: 15px; font-family: "Cairo";
    }
    .search-box input:focus { border-color: #3b82f6; }
    .search-box input::placeholder { color: #94a3b8; }

    /* CONTROLS BAR */
    .controls-bar {
      display: flex; gap: 10px; flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .control-group {
      display: flex; gap: 8px; align-items: center;
      background: rgba(255,255,255,0.04);
      padding: 10px 12px; border-radius: 14px;
      flex-wrap: wrap;
    }

    .control-group label {
      color: #cbd5e1; font-size: 13px; font-weight: 600;
    }

    .control-group input,
    .control-group select {
      padding: 8px 12px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.08);
      color: white; font-family: "Cairo"; font-size: 14px;
      outline: none;
    }

    .control-group input { width: 110px; }
    .control-group select { cursor: pointer; min-width: 150px; }
    .control-group select option { background: #1e293b; color: white; }

    .control-group input:focus,
    .control-group select:focus { border-color: #3b82f6; }

    .clear-filter-btn {
      background: rgba(239,68,68,0.2);
      color: #f87171; border: 1px solid rgba(239,68,68,0.3);
      padding: 8px 14px; border-radius: 10px;
      cursor: pointer; font-family: "Cairo"; font-size: 13px;
      font-weight: 700;
    }

    /* VIEW TOGGLE */
    .view-toggle {
      display: flex; gap: 4px;
      background: rgba(255,255,255,0.04);
      padding: 6px; border-radius: 14px;
    }

    .view-btn {
      background: transparent; border: none;
      color: #94a3b8; cursor: pointer;
      padding: 8px 14px; border-radius: 10px;
      font-family: "Cairo"; font-weight: 700; font-size: 13px;
      transition: 0.3s;
      display: flex; align-items: center; gap: 6px;
    }

    .view-btn:hover { color: white; }

    .view-btn.active {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      box-shadow: 0 4px 12px rgba(59,130,246,0.3);
    }

    /* TABS */
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-wrapper { position: relative; }

    .tab-btn {
      border: 2px solid rgba(255,255,255,0.1);
      cursor: pointer; padding: 10px 16px;
      border-radius: 14px; background: rgba(255,255,255,0.06);
      color: #cbd5e1; transition: 0.3s;
      font-weight: 700; font-size: 14px; font-family: "Cairo";
      display: flex; align-items: center; gap: 8px;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.12); }
    .tab-btn.active {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-color: transparent; color: white;
      box-shadow: 0 8px 20px rgba(59,130,246,0.3);
    }
    .tab-btn.has-dropdown::after {
      content: "▾"; font-size: 12px; margin-right: 2px;
    }
    .tab-count {
      background: rgba(255,255,255,0.2); padding: 2px 10px;
      border-radius: 20px; font-size: 12px; font-weight: 800;
    }

    /* DROPDOWN MENU */
    .dropdown-menu {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      background: rgba(30, 41, 59, 0.98);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 8px;
      min-width: 200px;
      z-index: 100;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      animation: dropDown 0.2s ease;
    }

    @keyframes dropDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tab-wrapper.open .dropdown-menu { display: block; }

    .dropdown-item {
      display: flex; justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      transition: 0.2s;
      font-family: "Cairo";
      border: none;
      background: transparent;
      width: 100%;
      text-align: right;
    }

    .dropdown-item:hover {
      background: rgba(255,255,255,0.08);
      color: white;
    }

    .dropdown-item.active {
      background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(139,92,246,0.3));
      color: white;
    }

    .dropdown-item .item-count {
      background: rgba(255,255,255,0.15);
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 16px; text-align: center;
    }
    .stat-card .icon { font-size: 24px; margin-bottom: 6px; }
    .stat-card h3 { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
    .stat-card .value { font-size: 22px; font-weight: 800; }
    .stat-card.total .value { color: #60a5fa; }
    .stat-card.up .value { color: #4ade80; }
    .stat-card.down .value { color: #fbbf24; }
    .stat-card.types .value { color: #a78bfa; }
    .stat-card.value-card .value { color: #34d399; font-size: 18px; }

    /* CATEGORY VALUES */
    .category-values {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 16px;
      margin-bottom: 16px;
    }
    .category-values h3 {
      font-size: 14px; color: #94a3b8;
      margin-bottom: 12px; font-weight: 600;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .category-value-item {
      background: rgba(255,255,255,0.05);
      padding: 12px; border-radius: 12px;
      display: flex; justify-content: space-between;
      align-items: center;
    }
    .category-value-item .name {
      font-size: 13px; color: #cbd5e1; font-weight: 600;
    }
    .category-value-item .amount {
      color: #34d399; font-weight: 800; font-size: 14px;
    }

    /* RESULTS COUNT */
    .results-info {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .results-info strong { color: #60a5fa; }

    /* GRID VIEW */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }

    .product-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      transition: 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.15);
    }

    .product-card.out-stock { opacity: 0.6; }

    .product-header {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px; margin-bottom: 14px;
    }

    .product-name {
      font-size: 15px; font-weight: 700;
      line-height: 1.6; color: #f1f5f9;
    }

    .product-category {
      color: #93c5fd; font-size: 12px;
      font-weight: 600; margin-top: 6px;
      display: inline-block;
      background: rgba(59,130,246,0.15);
      padding: 3px 10px; border-radius: 20px;
    }

    .total-badge {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white; padding: 8px 14px;
      border-radius: 12px; font-weight: 800;
      font-size: 18px; min-width: 50px; text-align: center;
      flex-shrink: 0;
    }

    .total-badge.zero {
      background: rgba(239,68,68,0.2);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
    }

    .price-tag {
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.15));
      border: 1px solid rgba(16,185,129,0.3);
      color: #34d399;
      padding: 10px 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      font-size: 17px;
      margin: 12px 0;
    }

    .price-tag.no-price {
      background: rgba(148,163,184,0.1);
      border-color: rgba(148,163,184,0.2);
      color: #94a3b8;
      font-size: 14px;
    }

    .shops {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }

    .shop {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 12px; text-align: center;
    }

    .shop-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
    .shop-value { font-size: 22px; font-weight: 800; }
    .shop-value.has { color: #4ade80; }
    .shop-value.empty { color: #64748b; }

    /* LIST VIEW */
    .products-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .product-row {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 14px 18px;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      align-items: center;
      gap: 16px;
      transition: 0.2s ease;
    }

    .product-row:hover {
      background: rgba(255,255,255,0.09);
      border-color: rgba(255,255,255,0.15);
      transform: translateX(-3px);
    }

    .product-row.out-stock { opacity: 0.55; }

    .row-info { min-width: 0; }

    .row-name {
      font-size: 15px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .row-category {
      color: #93c5fd;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
      background: rgba(59,130,246,0.15);
      padding: 2px 9px;
      border-radius: 20px;
    }

    .row-quantities {
      display: flex;
      gap: 14px;
      align-items: center;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
    }

    .row-quantities .q-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .row-quantities .q-label {
      color: #94a3b8;
      font-size: 12px;
    }

    .row-quantities .q-up { color: #4ade80; }
    .row-quantities .q-down { color: #fbbf24; }
    .row-quantities .q-total { color: #60a5fa; font-size: 15px; }
    .row-quantities .q-zero { color: #64748b; }

    .row-divider {
      width: 1px;
      height: 18px;
      background: rgba(255,255,255,0.1);
    }

    .row-price {
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.15));
      border: 1px solid rgba(16,185,129,0.3);
      color: #34d399;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 14px;
      white-space: nowrap;
      min-width: 110px;
      text-align: center;
    }

    .row-price.no-price {
      background: rgba(148,163,184,0.1);
      border-color: rgba(148,163,184,0.2);
      color: #94a3b8;
      font-size: 12px;
    }

    .row-total-badge {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 16px;
      min-width: 48px;
      text-align: center;
    }

    .row-total-badge.zero {
      background: rgba(239,68,68,0.2);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
    }

    /* COMPACT VIEW */
    .products-compact {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      overflow: hidden;
    }

    .compact-header,
    .compact-row {
      display: grid;
      grid-template-columns: 1fr 100px 70px 70px 70px 120px;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      font-size: 13px;
    }

    .compact-header {
      background: rgba(59,130,246,0.15);
      color: #93c5fd;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
    }

    .compact-row {
      border-top: 1px solid rgba(255,255,255,0.05);
      color: #e2e8f0;
      transition: 0.2s;
    }

    .compact-row:hover { background: rgba(255,255,255,0.04); }
    .compact-row.out-stock { opacity: 0.5; }

    .compact-name {
      font-weight: 700;
      color: #f1f5f9;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .compact-cat {
      color: #93c5fd;
      font-size: 11px;
      background: rgba(59,130,246,0.15);
      padding: 3px 8px;
      border-radius: 12px;
      text-align: center;
    }
    .compact-up { color: #4ade80; font-weight: 800; text-align: center; }
    .compact-down { color: #fbbf24; font-weight: 800; text-align: center; }
    .compact-total {
      color: #60a5fa;
      font-weight: 800;
      text-align: center;
      font-size: 15px;
    }
    .compact-total.zero { color: #f87171; }
    .compact-price {
      color: #34d399;
      font-weight: 800;
      text-align: center;
      font-size: 13px;
    }
    .compact-price.no-price { color: #64748b; font-size: 11px; }

    /* LOADING & EMPTY */
    .loading, .empty-state, .error-state {
      grid-column: 1/-1; text-align: center; padding: 50px 20px;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state .icon, .error-state .icon { font-size: 50px; margin-bottom: 10px; }
    .empty-state h3 { color: #94a3b8; }
    .error-state h3 { color: #f87171; margin-bottom: 6px; }
    .error-state p { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }

    .retry-btn {
      background: #ef4444; border: none; color: white;
      padding: 12px 24px; border-radius: 12px;
      cursor: pointer; font-family: "Cairo"; font-weight: 700;
    }

/* ============================ */
/* PDF EXPORT CONTAINER         */
/* ============================ */
#pdfExportContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 794px;
  background: white;
  font-family: "Cairo", Arial, sans-serif;
  direction: rtl;
  visibility: hidden;
  z-index: -1;
}

#pdfExportContainer.show {
  visibility: visible;
  z-index: 99998;
  overflow-y: auto;
  height: 100vh;
}

    .pdf-page {
      padding: 30px;
      background: white;
      color: #1e293b;
    }

    .pdf-header {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      padding: 25px 30px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pdf-header-title h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 6px;
      color: white;
    }

    .pdf-header-title p {
      font-size: 14px;
      opacity: 0.95;
      color: white;
    }

    .pdf-header-logo {
      width: 70px;
      height: 70px;
      background: rgba(255,255,255,0.25);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .pdf-date {
      text-align: center;
      color: #64748b;
      margin-bottom: 18px;
      font-size: 13px;
      font-weight: 600;
    }

    .pdf-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .pdf-stat {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .pdf-stat-icon {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .pdf-stat-label {
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .pdf-stat-value {
      font-size: 20px;
      font-weight: 800;
      color: #1e293b;
    }

    .pdf-stat.blue { border-color: #3b82f6; background: #eff6ff; }
    .pdf-stat.blue .pdf-stat-value { color: #1d4ed8; }
    .pdf-stat.green { border-color: #10b981; background: #ecfdf5; }
    .pdf-stat.green .pdf-stat-value { color: #047857; }
    .pdf-stat.orange { border-color: #f59e0b; background: #fffbeb; }
    .pdf-stat.orange .pdf-stat-value { color: #b45309; }
    .pdf-stat.purple { border-color: #8b5cf6; background: #f5f3ff; }
    .pdf-stat.purple .pdf-stat-value { color: #6d28d9; }

    .pdf-total-value {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 18px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 18px;
    }

    .pdf-total-value-label {
      font-size: 13px;
      opacity: 0.95;
      margin-bottom: 4px;
    }

    .pdf-total-value-amount {
      font-size: 28px;
      font-weight: 800;
    }

    .pdf-section-title {
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
      margin: 18px 0 10px;
      padding: 8px 14px;
      background: #eff6ff;
      border-right: 4px solid #3b82f6;
      border-radius: 8px;
    }

    .pdf-categories-summary {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .pdf-cat-summary {
      background: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* PDF Loading Overlay */
    .pdf-loading-overlay {
      display: none;

      .compact-down::before { content: "⬇ "; color: #94a3b8; }

    @media print {
      body { background: white !important; color: black !important; padding: 10px; }
      .header-buttons, .search-box, .tabs, .controls-bar,
      .refresh-btn, .retry-btn, .last-update, .results-info,
      #pdfExportContainer, .pdf-loading-overlay {
        display: none !important;
      }
      .header, .stat-card, .product-card, .product-row,
      .category-values, .products-compact {
        background: white !important;
        border: 1px solid #ddd !important;
        color: black !important;
        box-shadow: none !important;
        page-break-inside: avoid;
      }
      .product-name, .row-name, .compact-name,
      .stat-card h3, .header h1 { color: black !important; }

  </style>
</head>

  <!-- html2pdf Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>

  <script>
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwqrE5U8e1QOYfaeH9IWAaoh7jPHFAHxF_qD2i8vyQwnfhvrg2CaHHvNHXOsZ8r2IIo/exec";

    let allProducts = [];
    let currentFilter = "all";
    let currentSubFilter = "all";
    let currentView = localStorage.getItem("stockView") || "list";
    let currentSort = localStorage.getItem("stockSort") || "qty-desc";

    function detectCategory(name) {
      const n = name.toLowerCase();
      if (n.includes("iphone")) return "iphone";
      if (n.includes("ipad")) return "ipad";
      if (n.includes("macbook")) return "macbook";
      return "accessories";
    }

    function detectSubCategory(name, mainCat) {
      const n = name.toLowerCase();
      if (mainCat === "ipad") {
        if (n.includes("pro")) return "pro";
        if (n.includes("air")) return "air";
        return "other";
      }
      if (mainCat === "macbook") {
        if (n.includes("neo")) return "neo";
        if (n.includes("pro")) return "pro";
        if (n.includes("air")) return "air";
        return "other";
      }
      if (mainCat === "accessories") {
        if (n.includes("dji")) return "dji";
        if (n.includes("ray-ban") || n.includes("rayban") || n.includes("ray ban")) return "rayban";
        if (n.includes("pencil")) return "pencil";
        if (n.includes("watch")) return "watch";
        if (n.includes("airpod") || n.includes("air pod")) return "airpods";
        if (n.includes("insta360") || n.includes("insta 360")) return "insta360";
        if (n.includes("magic keyboard") || n.includes("keyboard")) return "keyboard";
        if (n.includes("samsung")) return "samsung";
        return "others";
      }
      return "all";
    }

    function extractSize(name) {
      const match = name.match(/(\d+(\.\d+)?)\s*(in|inch|"|″)/i);
      if (match) return parseFloat(match[1]);
      const m2 = name.match(/\b(\d{2}(\.\d)?)\b/);
      if (m2) {
        const num = parseFloat(m2[1]);
        if (num >= 11 && num <= 17) return num;
      }
      return 0;
    }

    function getCategoryIcon(cat) {
      if (cat === "iphone") return "📱";
      if (cat === "ipad") return "📋";
      if (cat === "macbook") return "💻";
      return "🎧";
    }

    function getCategoryText(cat) {
      if (cat === "iphone") return "iPhone";
      if (cat === "ipad") return "iPad";
      if (cat === "macbook") return "MacBook";
      return "accessories";
    }

    function cleanName(name) {
      return name.replace(/\*/g, "").replace(/\s+/g, " ").trim();
    }

    function formatPrice(price) {
      if (!price || price === 0) return "غير محدد";
      return parseInt(price).toLocaleString("en-US") + " ج";
    }

    async function loadData() {
      const container = document.getElementById("productsContainer");
      container.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>جاري تحميل الستوك...</p>
        </div>
      `;

      try {
        const response = await fetch(SHEET_API_URL);
        const data = await response.json();

        allProducts = data.map(item => {
          const cleaned = cleanName(item.name);
          const mainCat = detectCategory(item.name);
          return {
            name: cleaned,
            rawName: item.name,
            category: mainCat,
            subCategory: detectSubCategory(item.name, mainCat),
            size: extractSize(item.name),
            shopUp: item.shopUp,
            shopDown: item.shopDown,
            total: item.total,
            price: item.price || 0
          };
        });

        const now = new Date();
        document.getElementById("lastUpdate").textContent =
          "آخر تحديث: " + now.toLocaleTimeString("ar-EG", {hour: '2-digit', minute:'2-digit'}) +
          " - " + now.toLocaleDateString("ar-EG");

        updateStats();
        updateCategoryValues();
        updateTabCounts();
        updateSubCounts();
        renderProducts();

      } catch (error) {
        container.innerHTML = `
          <div class="error-state">
            <div class="icon">😵</div>
            <h3>حصل مشكلة في تحميل البيانات</h3>
            <p>تأكد من اتصال الإنترنت ومن رابط الشيت</p>
            <button class="retry-btn" onclick="loadData()">🔄 حاول تاني</button>
          </div>
        `;
      }
    }

    function updateStats() {
      const totalUp = allProducts.reduce((sum, p) => sum + p.shopUp, 0);
      const totalDown = allProducts.reduce((sum, p) => sum + p.shopDown, 0);
      const totalAll = allProducts.reduce((sum, p) => sum + p.total, 0);
      const totalValue = allProducts.reduce((sum, p) => sum + (p.total * p.price), 0);

      document.getElementById("totalQty").textContent = totalAll;
      document.getElementById("upQty").textContent = totalUp;
      document.getElementById("downQty").textContent = totalDown;
      document.getElementById("typesQty").textContent = allProducts.length;
      document.getElementById("totalValue").textContent = 
        totalValue.toLocaleString("en-US") + " ج";
    }

    function updateCategoryValues() {
      const categories = ["iphone", "ipad", "macbook", "accessories"];
      const container = document.getElementById("categoryValues");
      container.innerHTML = "";

      categories.forEach(cat => {
        const items = allProducts.filter(p => p.category === cat);
        const value = items.reduce((sum, p) => sum + (p.total * p.price), 0);
        const qty = items.reduce((sum, p) => sum + p.total, 0);

        const div = document.createElement("div");
        div.className = "category-value-item";
        div.innerHTML = `
          <div>
            <div class="name">${getCategoryIcon(cat)} ${getCategoryText(cat)}</div>
            <div style="color: #64748b; font-size: 11px; margin-top: 2px;">${qty} قطعة</div>
          </div>
          <div class="amount">${value.toLocaleString("en-US")} ج</div>
        `;
        container.appendChild(div);
      });
    }

    function updateTabCounts() {
      document.getElementById("count-all").textContent = allProducts.length;
      document.getElementById("count-iphone").textContent =
        allProducts.filter(p => p.category === "iphone").length;
      document.getElementById("count-ipad").textContent =
        allProducts.filter(p => p.category === "ipad").length;
      document.getElementById("count-macbook").textContent =
        allProducts.filter(p => p.category === "macbook").length;
      document.getElementById("count-accessories").textContent =
        allProducts.filter(p => p.category === "accessories").length;
    }

    function updateSubCounts() {
      const ipads = allProducts.filter(p => p.category === "ipad");
      document.getElementById("sub-ipad-all").textContent = ipads.length;
      document.getElementById("sub-ipad-pro").textContent = ipads.filter(p => p.subCategory === "pro").length;
      document.getElementById("sub-ipad-air").textContent = ipads.filter(p => p.subCategory === "air").length;

      const macs = allProducts.filter(p => p.category === "macbook");
      document.getElementById("sub-mac-all").textContent = macs.length;
      document.getElementById("sub-mac-pro").textContent = macs.filter(p => p.subCategory === "pro").length;
      document.getElementById("sub-mac-air").textContent = macs.filter(p => p.subCategory === "air").length;
      document.getElementById("sub-mac-neo").textContent = macs.filter(p => p.subCategory === "neo").length;

      const accs = allProducts.filter(p => p.category === "accessories");
      document.getElementById("sub-acc-all").textContent = accs.length;
      document.getElementById("sub-acc-dji").textContent = accs.filter(p => p.subCategory === "dji").length;
      document.getElementById("sub-acc-rayban").textContent = accs.filter(p => p.subCategory === "rayban").length;
      document.getElementById("sub-acc-pencil").textContent = accs.filter(p => p.subCategory === "pencil").length;
      document.getElementById("sub-acc-watch").textContent = accs.filter(p => p.subCategory === "watch").length;
      document.getElementById("sub-acc-airpods").textContent = accs.filter(p => p.subCategory === "airpods").length;
      document.getElementById("sub-acc-insta360").textContent = accs.filter(p => p.subCategory === "insta360").length;
      document.getElementById("sub-acc-keyboard").textContent = accs.filter(p => p.subCategory === "keyboard").length;
      document.getElementById("sub-acc-samsung").textContent = accs.filter(p => p.subCategory === "samsung").length;
      document.getElementById("sub-acc-others").textContent = accs.filter(p => p.subCategory === "others").length;
    }

    function sortProducts(arr) {
      const sorted = [...arr];
      switch (currentSort) {
        case "qty-desc":
          sorted.sort((a, b) => b.total - a.total);
          break;
        case "price-desc":
          sorted.sort((a, b) => b.price - a.price);
          break;
        case "price-asc":
          sorted.sort((a, b) => {
            if (a.price === 0) return 1;
            if (b.price === 0) return -1;
            return a.price - b.price;
          });
          break;
        case "name-asc":
          sorted.sort((a, b) => a.name.localeCompare(b.name, 'ar'));
          break;
        case "size-asc":
          sorted.sort((a, b) => a.size - b.size);
          break;
      }
      return sorted;
    }

    function renderProducts() {
      const container = document.getElementById("productsContainer");
      const searchValue = document.getElementById("searchInput").value.toLowerCase().trim();
      const minPrice = parseInt(document.getElementById("minPrice").value) || 0;
      const maxPrice = parseInt(document.getElementById("maxPrice").value) || Infinity;

      let filtered = allProducts.filter(product => {
        const matchCategory =
          currentFilter === "all" || product.category === currentFilter;
        let matchSub = true;
        if (currentSubFilter !== "all" && currentFilter !== "all") {
          matchSub = product.subCategory === currentSubFilter;
        }
        const matchSearch =
          product.name.toLowerCase().includes(searchValue) ||
          product.rawName.toLowerCase().includes(searchValue);
        const matchPrice = 
          product.price >= minPrice && product.price <= maxPrice;
        return matchCategory && matchSub && matchSearch && matchPrice;
      });

      filtered = sortProducts(filtered);

      const totalQty = filtered.reduce((s, p) => s + p.total, 0);
      const totalVal = filtered.reduce((s, p) => s + (p.price * p.total), 0);
      document.getElementById("resultsInfo").innerHTML = filtered.length > 0
        ? `📊 <strong>${filtered.length}</strong> موديل • <strong>${totalQty}</strong> قطعة • قيمة: <strong>${totalVal.toLocaleString("en-US")} ج</strong>`
        : "";

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <h3>مفيش نتائج</h3>
            <p>جرب تبحث بكلمة تانية أو غيّر الفلتر</p>
          </div>
        `;
        return;
      }

      if (currentView === "grid") renderGridView(container, filtered);
      else if (currentView === "list") renderListView(container, filtered);
      else if (currentView === "compact") renderCompactView(container, filtered);
    }

    function renderGridView(container, products) {
      container.className = "products-grid";
      container.innerHTML = "";
      products.forEach(product => {
        const card = document.createElement("div");
        card.className = "product-card";
        if (product.total === 0) card.classList.add("out-stock");
        const priceClass = product.price > 0 ? "" : "no-price";
        card.innerHTML = `
          <div class="product-header">
            <div style="flex: 1;">
              <div class="product-name">${product.name}</div>
              <div class="product-category">
                ${getCategoryIcon(product.category)} ${getCategoryText(product.category)}
              </div>
            </div>
            <div class="total-badge ${product.total === 0 ? 'zero' : ''}">
              ${product.total}
            </div>
          </div>
          <div class="price-tag ${priceClass}">
            💰 ${formatPrice(product.price)}
          </div>
          <div class="shops">
            <div class="shop">
              <div class="shop-label">⬆️ المحل اللي فوق</div>
              <div class="shop-value ${product.shopUp > 0 ? 'has' : 'empty'}">
                ${product.shopUp}
              </div>
            </div>
            <div class="shop">
              <div class="shop-label">⬇️ المحل اللي تحت</div>
              <div class="shop-value ${product.shopDown > 0 ? 'has' : 'empty'}">
                ${product.shopDown}
              </div>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderListView(container, products) {
      container.className = "products-list";
      container.innerHTML = "";
      products.forEach(product => {
        const row = document.createElement("div");
        row.className = "product-row";
        if (product.total === 0) row.classList.add("out-stock");
        const priceClass = product.price > 0 ? "" : "no-price";
        row.innerHTML = `
          <div class="row-info">
            <div class="row-name">${product.name}</div>
            <div class="row-category">
              ${getCategoryIcon(product.category)} ${getCategoryText(product.category)}
            </div>
          </div>
          <div class="row-quantities">
            <div class="q-item">
              <span class="q-label">⬆️ فوق:</span>
              <span class="${product.shopUp > 0 ? 'q-up' : 'q-zero'}">${product.shopUp}</span>
            </div>
            <div class="row-divider"></div>
            <div class="q-item">
              <span class="q-label">⬇️ تحت:</span>
              <span class="${product.shopDown > 0 ? 'q-down' : 'q-zero'}">${product.shopDown}</span>
            </div>
            <div class="row-divider"></div>
            <div class="q-item">
              <span class="q-label">الإجمالي:</span>
              <span class="${product.total > 0 ? 'q-total' : 'q-zero'}">${product.total}</span>
            </div>
          </div>
          <div class="row-price ${priceClass}">
            💰 ${formatPrice(product.price)}
          </div>
          <div class="row-total-badge ${product.total === 0 ? 'zero' : ''}">
            ${product.total}
          </div>
        `;
        container.appendChild(row);
      });
    }

    function renderCompactView(container, products) {
      container.className = "products-compact";
      let html = `
        <div class="compact-header">
          <div>المنتج</div>
          <div style="text-align:center;">القسم</div>
          <div style="text-align:center;">⬆️ فوق</div>
          <div style="text-align:center;">⬇️ تحت</div>
          <div style="text-align:center;">الإجمالي</div>
          <div style="text-align:center;">السعر</div>
        </div>
      `;
      products.forEach(product => {
        const outClass = product.total === 0 ? "out-stock" : "";
        const totalZero = product.total === 0 ? "zero" : "";
        const priceClass = product.price > 0 ? "" : "no-price";
        html += `
          <div class="compact-row ${outClass}">
            <div class="compact-name">${product.name}</div>
            <div class="compact-cat">${getCategoryIcon(product.category)} ${getCategoryText(product.category)}</div>
            <div class="compact-up">${product.shopUp}</div>
            <div class="compact-down">${product.shopDown}</div>
            <div class="compact-total ${totalZero}">${product.total}</div>
            <div class="compact-price ${priceClass}">${formatPrice(product.price)}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function clearPriceFilter() {
      document.getElementById("minPrice").value = "";
      document.getElementById("maxPrice").value = "";
      renderProducts();
    }

// ============================================
//   PDF EXPORT - Professional Design
// ============================================
function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');

  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();

  const now = new Date();
  const dateStr = now.toLocaleDateString("en-GB");
  const timeStr = now.toLocaleTimeString("en-GB", {hour: '2-digit', minute:'2-digit'});

  // ============ Calculate Stats ============
  const totalAll = allProducts.reduce((sum, p) => sum + p.total, 0);
  const totalUp = allProducts.reduce((sum, p) => sum + p.shopUp, 0);
  const totalDown = allProducts.reduce((sum, p) => sum + p.shopDown, 0);
  const totalValue = allProducts.reduce((sum, p) => sum + (p.total * p.price), 0);

  // ============ HEADER (Blue/Purple Gradient Effect) ============
  // Main header background
  doc.setFillColor(59, 130, 246); // Blue
  doc.rect(0, 0, pageWidth, 32, 'F');
  
  // Purple accent strip
  doc.setFillColor(139, 92, 246);
  doc.rect(0, 28, pageWidth, 4, 'F');

  // Logo box (white)
  doc.setFillColor(255, 255, 255);
  doc.roundedRect(pageWidth - 28, 6, 20, 20, 3, 3, 'F');
  doc.setFontSize(16);
  doc.setTextColor(59, 130, 246);
  doc.text("M", pageWidth - 21, 19);

  // Title
  doc.setFontSize(22);
  doc.setTextColor(255, 255, 255);
  doc.setFont(undefined, 'bold');
  doc.text("ONE MOBILE", 14, 16);
  
  doc.setFontSize(11);
  doc.setFont(undefined, 'normal');
  doc.text("Stock Inventory Report", 14, 23);

  // ============ Date Bar ============
  doc.setFillColor(248, 250, 252);
  doc.rect(0, 32, pageWidth, 9, 'F');
  doc.setFontSize(9);
  doc.setTextColor(100, 116, 139);
  doc.text(`Generated: ${dateStr} at ${timeStr}`, 14, 38);
  doc.setFont(undefined, 'bold');
  doc.setTextColor(59, 130, 246);
  doc.text(`Report ID: #${Date.now().toString().slice(-6)}`, pageWidth - 14, 38, { align: 'right' });

  // ============ STATS CARDS ============
  let yPos = 48;
  const cardWidth = (pageWidth - 28 - 9) / 4;  // 4 cards with gaps
  const cardHeight = 22;
  
  const statsData = [
    { label: 'TOTAL ITEMS', value: totalAll.toString(), color: [59, 130, 246], bg: [239, 246, 255] },
    { label: 'UPSTAIRS', value: totalUp.toString(), color: [16, 185, 129], bg: [236, 253, 245] },
    { label: 'DOWNSTAIRS', value: totalDown.toString(), color: [245, 158, 11], bg: [255, 251, 235] },
    { label: 'MODELS', value: allProducts.length.toString(), color: [139, 92, 246], bg: [245, 243, 255] }
  ];

  statsData.forEach((stat, i) => {
    const x = 14 + (i * (cardWidth + 3));
    
    // Background
    doc.setFillColor(...stat.bg);
    doc.roundedRect(x, yPos, cardWidth, cardHeight, 2, 2, 'F');
    
    // Top border accent
    doc.setFillColor(...stat.color);
    doc.roundedRect(x, yPos, cardWidth, 2, 1, 1, 'F');
    
    // Label
    doc.setFontSize(7);
    doc.setTextColor(100, 116, 139);
    doc.setFont(undefined, 'bold');
    doc.text(stat.label, x + cardWidth/2, yPos + 8, { align: 'center' });
    
    // Value
    doc.setFontSize(16);
    doc.setTextColor(...stat.color);
    doc.text(stat.value, x + cardWidth/2, yPos + 17, { align: 'center' });
  });

  // ============ TOTAL VALUE BANNER ============
  yPos += cardHeight + 5;
  doc.setFillColor(16, 185, 129);
  doc.roundedRect(14, yPos, pageWidth - 28, 14, 2, 2, 'F');
  
  doc.setFontSize(9);
  doc.setTextColor(255, 255, 255);
  doc.setFont(undefined, 'normal');
  doc.text("TOTAL STOCK VALUE", 20, yPos + 6);
  
  doc.setFontSize(16);
  doc.setFont(undefined, 'bold');
  doc.text(`${totalValue.toLocaleString("en-US")} EGP`, pageWidth - 20, yPos + 9, { align: 'right' });

  // ============ CATEGORIES SUMMARY ============
  yPos += 19;
  
  // Section title
  doc.setFillColor(239, 246, 255);
  doc.rect(14, yPos, pageWidth - 28, 7, 'F');
  doc.setFillColor(59, 130, 246);
  doc.rect(14, yPos, 2, 7, 'F');
  doc.setFontSize(10);
  doc.setTextColor(30, 41, 59);
  doc.setFont(undefined, 'bold');
  doc.text("Categories Summary", 19, yPos + 5);

  yPos += 10;
  
  const categories = ["iphone", "ipad", "macbook", "accessories"];
  const catWidth = (pageWidth - 28 - 6) / 4;
  
  categories.forEach((cat, i) => {
    const items = allProducts.filter(p => p.category === cat);
    const value = items.reduce((sum, p) => sum + (p.total * p.price), 0);
    const qty = items.reduce((sum, p) => sum + p.total, 0);
    const x = 14 + (i * (catWidth + 2));
    
    // Card
    doc.setFillColor(248, 250, 252);
    doc.roundedRect(x, yPos, catWidth, 18, 2, 2, 'F');
    doc.setDrawColor(226, 232, 240);
    doc.roundedRect(x, yPos, catWidth, 18, 2, 2, 'S');
    
    // Category name
    doc.setFontSize(9);
    doc.setTextColor(30, 41, 59);
    doc.setFont(undefined, 'bold');
    doc.text(getCategoryText(cat), x + catWidth/2, yPos + 6, { align: 'center' });
    
    // Qty
    doc.setFontSize(7);
    doc.setTextColor(100, 116, 139);
    doc.setFont(undefined, 'normal');
    doc.text(`${items.length} models / ${qty} pcs`, x + catWidth/2, yPos + 10, { align: 'center' });
    
    // Value
    doc.setFontSize(9);
    doc.setTextColor(4, 120, 87);
    doc.setFont(undefined, 'bold');
    doc.text(`${value.toLocaleString("en-US")} EGP`, x + catWidth/2, yPos + 15, { align: 'center' });
  });

  // ============ PRODUCTS TABLE ============
  yPos += 23;
  
  // Section title
  doc.setFillColor(239, 246, 255);
  doc.rect(14, yPos, pageWidth - 28, 7, 'F');
  doc.setFillColor(59, 130, 246);
  doc.rect(14, yPos, 2, 7, 'F');
  doc.setFontSize(10);
  doc.setTextColor(30, 41, 59);
  doc.setFont(undefined, 'bold');
  doc.text("Products Details", 19, yPos + 5);

  yPos += 9;

  // Sort products by category
  const sortedProducts = [...allProducts].sort((a, b) => {
    if (a.category !== b.category) return a.category.localeCompare(b.category);
    return b.total - a.total;
  });

  const rows = sortedProducts.map((p, idx) => [
    (idx + 1).toString(),
    p.name,
    getCategoryText(p.category),
    p.shopUp.toString(),
    p.shopDown.toString(),
    p.total.toString(),
    p.price > 0 ? p.price.toLocaleString("en-US") : "-",
    p.price > 0 ? (p.price * p.total).toLocaleString("en-US") : "-"
  ]);

  doc.autoTable({
    startY: yPos,
    head: [['#', 'Product Name', 'Category', 'Up', 'Down', 'Total', 'Price (EGP)', 'Value (EGP)']],
    body: rows,
    theme: 'grid',
    styles: {
      fontSize: 8,
      cellPadding: 2.5,
      lineColor: [226, 232, 240],
      lineWidth: 0.1,
      textColor: [30, 41, 59]
    },
    headStyles: {
      fillColor: [59, 130, 246],
      textColor: [255, 255, 255],
      fontStyle: 'bold',
      fontSize: 9,
      halign: 'center',
      cellPadding: 3
    },
    alternateRowStyles: {
      fillColor: [248, 250, 252]
    },
    columnStyles: {
      0: { cellWidth: 8, halign: 'center', textColor: [100, 116, 139], fontStyle: 'bold' },
      1: { cellWidth: 65, halign: 'left', fontStyle: 'bold' },
      2: { cellWidth: 22, halign: 'center', fontSize: 7 },
      3: { cellWidth: 12, halign: 'center', textColor: [4, 120, 87], fontStyle: 'bold' },
      4: { cellWidth: 12, halign: 'center', textColor: [180, 83, 9], fontStyle: 'bold' },
      5: { cellWidth: 14, halign: 'center', textColor: [29, 78, 216], fontStyle: 'bold', fontSize: 10 },
      6: { cellWidth: 24, halign: 'right', textColor: [4, 120, 87], fontStyle: 'bold' },
      7: { cellWidth: 25, halign: 'right', textColor: [109, 40, 217], fontStyle: 'bold' }
    },
    didParseCell: function(data) {
      // Zero quantities styling
      if (data.column.index === 3 || data.column.index === 4) {
        if (data.cell.raw === '0') {
          data.cell.styles.textColor = [148, 163, 184];
          data.cell.styles.fontStyle = 'normal';
        }
      }
      if (data.column.index === 5 && data.cell.raw === '0') {
        data.cell.styles.textColor = [239, 68, 68];
      }
      // No price styling
      if ((data.column.index === 6 || data.column.index === 7) && data.cell.raw === '-') {
        data.cell.styles.textColor = [148, 163, 184];
        data.cell.styles.fontStyle = 'normal';
      }
    },
    didDrawPage: function(data) {
      // Footer on each page
      const pageCount = doc.internal.getNumberOfPages();
      const currentPage = doc.internal.getCurrentPageInfo().pageNumber;
      
      // Footer line
      doc.setDrawColor(59, 130, 246);
      doc.setLineWidth(0.5);
      doc.line(14, pageHeight - 15, pageWidth - 14, pageHeight - 15);
      
      // Footer text
      doc.setFontSize(8);
      doc.setTextColor(100, 116, 139);
      doc.setFont(undefined, 'normal');
      doc.text("ONE MOBILE - Stock Report", 14, pageHeight - 9);
      doc.text(`${dateStr} ${timeStr}`, pageWidth / 2, pageHeight - 9, { align: 'center' });
      doc.text(`Page ${currentPage} of ${pageCount}`, pageWidth - 14, pageHeight - 9, { align: 'right' });
    },
    margin: { top: 10, bottom: 20, left: 14, right: 14 }
  });

  // ============ Save ============
  doc.save(`OneMobile_Stock_${now.toISOString().split('T')[0]}.pdf`);
}

    // ============================================
    //   Events
    // ============================================
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const wrapper = btn.closest(".tab-wrapper");
        const hasDropdown = btn.classList.contains("has-dropdown");

        document.querySelectorAll(".tab-wrapper").forEach(w => {
          if (w !== wrapper) w.classList.remove("open");
        });

        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");

        currentFilter = btn.dataset.filter;
        currentSubFilter = "all";

        if (wrapper) {
          wrapper.querySelectorAll(".dropdown-item").forEach(it => it.classList.remove("active"));
          const allItem = wrapper.querySelector('.dropdown-item[data-sub="all"]');
          if (allItem) allItem.classList.add("active");
        }

        if (hasDropdown) {
          wrapper.classList.toggle("open");
        }

        renderProducts();
      });
    });

    document.querySelectorAll(".dropdown-item").forEach(item => {
      item.addEventListener("click", (e) => {
        e.stopPropagation();
        const wrapper = item.closest(".tab-wrapper");
        const mainFilter = item.dataset.filter;
        const subFilter = item.dataset.sub;

        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        wrapper.querySelector(".tab-btn").classList.add("active");

        wrapper.querySelectorAll(".dropdown-item").forEach(it => it.classList.remove("active"));
        item.classList.add("active");

        currentFilter = mainFilter;
        currentSubFilter = subFilter;
        wrapper.classList.remove("open");

        renderProducts();
      });
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".tab-wrapper")) {
        document.querySelectorAll(".tab-wrapper").forEach(w => w.classList.remove("open"));
      }
    });

    document.querySelectorAll(".view-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentView = btn.dataset.view;
        localStorage.setItem("stockView", currentView);
        renderProducts();
      });
    });

    const savedViewBtn = document.querySelector(`.view-btn[data-view="${currentView}"]`);
    if (savedViewBtn) {
      document.querySelectorAll(".view-btn").forEach(b => b.classList.remove("active"));
      savedViewBtn.classList.add("active");
    }

    const sortSelect = document.getElementById("sortSelect");
    sortSelect.value = currentSort;
    sortSelect.addEventListener("change", () => {
      currentSort = sortSelect.value;
      localStorage.setItem("stockSort", currentSort);
      renderProducts();
    });

    document.getElementById("searchInput").addEventListener("input", renderProducts);
    document.getElementById("minPrice").addEventListener("input", renderProducts);
    document.getElementById("maxPrice").addEventListener("input", renderProducts);

    loadData();
    setInterval(loadData, 3 * 60 * 1000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('SW registered'))
          .catch(err => console.log('SW failed'));
      });
    }
  </script>
