<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ONE MOBILE - ستوك المحل</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ONE MOBILE">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Cairo", Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #111827 100%);
      color: #fff;
      min-height: 100vh;
      padding: 16px;
    }

    .container { max-width: 1400px; margin: auto; }

    /* HEADER */
    .header {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
    }

    .header-top {
      display: flex; justify-content: space-between;
      align-items: center; flex-wrap: wrap; gap: 12px;
      margin-bottom: 16px;
    }

    .header-title {
      display: flex; align-items: center; gap: 12px;
    }

    .logo {
      width: 50px; height: 50px;
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
    }

    .header h1 { font-size: 22px; font-weight: 800; line-height: 1.2; }
    .header h1 span {
      background: linear-gradient(135deg, #3b82f6, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block; font-size: 14px;
    }

    .header-buttons {
      display: flex; gap: 8px; flex-wrap: wrap;
    }

    .btn {
      border: none; color: white; padding: 11px 18px;
      border-radius: 12px; cursor: pointer;
      font-family: "Cairo"; font-weight: 700; font-size: 13px;
      display: flex; align-items: center; gap: 6px;
      transition: 0.3s;
    }
    .btn:hover { transform: translateY(-2px); }

    .btn-primary { background: linear-gradient(135deg, #3b82f6, #8b5cf6); }
    .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
    .btn-warning { background: linear-gradient(135deg, #f59e0b, #d97706); }

    .last-update { color: #94a3b8; font-size: 13px; margin-bottom: 14px; }

    /* SEARCH */
    .search-box { position: relative; margin-bottom: 14px; }
    .search-box input {
      width: 100%; padding: 14px 18px;
      border-radius: 14px; border: 2px solid rgba(255,255,255,0.1);
      outline: none; background: rgba(255,255,255,0.08);
      color: white; font-size: 15px; font-family: "Cairo";
    }
    .search-box input:focus { border-color: #3b82f6; }
    .search-box input::placeholder { color: #94a3b8; }

    /* PRICE FILTER */
    .price-filter {
      display: flex; gap: 10px; align-items: center;
      margin-bottom: 14px; flex-wrap: wrap;
      background: rgba(255,255,255,0.04);
      padding: 12px; border-radius: 14px;
    }
    .price-filter label {
      color: #cbd5e1; font-size: 13px; font-weight: 600;
    }
    .price-filter input {
      width: 130px; padding: 8px 12px;
      border-radius: 10px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.08);
      color: white; font-family: "Cairo"; font-size: 14px;
    }
    .price-filter input:focus { outline: none; border-color: #3b82f6; }

    .clear-filter-btn {
      background: rgba(239,68,68,0.2);
      color: #f87171; border: 1px solid rgba(239,68,68,0.3);
      padding: 8px 14px; border-radius: 10px;
      cursor: pointer; font-family: "Cairo"; font-size: 13px;
      font-weight: 700;
    }

    /* TABS */
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; }
    .tab-btn {
      border: 2px solid rgba(255,255,255,0.1);
      cursor: pointer; padding: 10px 16px;
      border-radius: 14px; background: rgba(255,255,255,0.06);
      color: #cbd5e1; transition: 0.3s;
      font-weight: 700; font-size: 14px; font-family: "Cairo";
      display: flex; align-items: center; gap: 8px;
    }
    .tab-btn:hover { background: rgba(255,255,255,0.12); }
    .tab-btn.active {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-color: transparent; color: white;
      box-shadow: 0 8px 20px rgba(59,130,246,0.3);
    }
    .tab-count {
      background: rgba(255,255,255,0.2); padding: 2px 10px;
      border-radius: 20px; font-size: 12px; font-weight: 800;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 16px; text-align: center;
    }
    .stat-card .icon { font-size: 24px; margin-bottom: 6px; }
    .stat-card h3 { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
    .stat-card .value { font-size: 22px; font-weight: 800; }
    .stat-card.total .value { color: #60a5fa; }
    .stat-card.up .value { color: #4ade80; }
    .stat-card.down .value { color: #fbbf24; }
    .stat-card.types .value { color: #a78bfa; }
    .stat-card.value-card .value { color: #34d399; font-size: 18px; }

    /* CATEGORY VALUES */
    .category-values {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px; padding: 16px;
      margin-bottom: 16px;
    }
    .category-values h3 {
      font-size: 14px; color: #94a3b8;
      margin-bottom: 12px; font-weight: 600;
    }
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }
    .category-value-item {
      background: rgba(255,255,255,0.05);
      padding: 12px; border-radius: 12px;
      display: flex; justify-content: space-between;
      align-items: center;
    }
    .category-value-item .name {
      font-size: 13px; color: #cbd5e1; font-weight: 600;
    }
    .category-value-item .amount {
      color: #34d399; font-weight: 800; font-size: 14px;
    }

    /* PRODUCTS */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 14px;
    }

    .product-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 18px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.18);
      transition: 0.3s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,0.15);
    }

    .product-card.out-stock { opacity: 0.6; }

    .product-header {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 10px; margin-bottom: 14px;
    }

    .product-name {
      font-size: 15px; font-weight: 700;
      line-height: 1.6; color: #f1f5f9;
    }

    .product-category {
      color: #93c5fd; font-size: 12px;
      font-weight: 600; margin-top: 6px;
      display: inline-block;
      background: rgba(59,130,246,0.15);
      padding: 3px 10px; border-radius: 20px;
    }

    .total-badge {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white; padding: 8px 14px;
      border-radius: 12px; font-weight: 800;
      font-size: 18px; min-width: 50px; text-align: center;
      flex-shrink: 0;
    }

    .total-badge.zero {
      background: rgba(239,68,68,0.2);
      color: #f87171;
      border: 1px solid rgba(239,68,68,0.3);
    }

    .price-tag {
      background: linear-gradient(135deg, rgba(16,185,129,0.15), rgba(5,150,105,0.15));
      border: 1px solid rgba(16,185,129,0.3);
      color: #34d399;
      padding: 10px 14px;
      border-radius: 12px;
      text-align: center;
      font-weight: 800;
      font-size: 17px;
      margin: 12px 0;
    }

    .price-tag.no-price {
      background: rgba(148,163,184,0.1);
      border-color: rgba(148,163,184,0.2);
      color: #94a3b8;
      font-size: 14px;
    }

    .shops {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }

    .shop {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px; padding: 12px; text-align: center;
    }

    .shop-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; font-weight: 600; }
    .shop-value { font-size: 22px; font-weight: 800; }
    .shop-value.has { color: #4ade80; }
    .shop-value.empty { color: #64748b; }

    /* LOADING & EMPTY */
    .loading, .empty-state, .error-state {
      grid-column: 1/-1; text-align: center; padding: 50px 20px;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state .icon, .error-state .icon { font-size: 50px; margin-bottom: 10px; }
    .empty-state h3 { color: #94a3b8; }
    .error-state h3 { color: #f87171; margin-bottom: 6px; }
    .error-state p { color: #94a3b8; font-size: 14px; margin-bottom: 16px; }

    .retry-btn {
      background: #ef4444; border: none; color: white;
      padding: 12px 24px; border-radius: 12px;
      cursor: pointer; font-family: "Cairo"; font-weight: 700;
    }

    @media (max-width: 768px) {
      body { padding: 10px; }
      .header { padding: 18px; }
      .header h1 { font-size: 18px; }
      .products-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .price-filter input { width: 110px; }
    }

    /* ===== PRINT STYLES ===== */
    @media print {
      body {
        background: white !important;
        color: black !important;
        padding: 10px;
      }
      .header-buttons, .search-box, .tabs, .price-filter,
      .refresh-btn, .retry-btn, .last-update {
        display: none !important;
      }
      .header, .stat-card, .product-card, .category-values {
        background: white !important;
        border: 1px solid #ddd !important;
        color: black !important;
        box-shadow: none !important;
        page-break-inside: avoid;
      }
      .product-name, .stat-card h3, .header h1 {
        color: black !important;
      }
      .product-category {
        background: #eee !important;
        color: #333 !important;
      }
      .total-badge {
        background: #333 !important;
        color: white !important;
      }
      .price-tag {
        background: #f0f9ff !important;
        color: #065f46 !important;
        border-color: #10b981 !important;
      }
      .shop {
        background: #f9f9f9 !important;
        border-color: #ddd !important;
      }
      .shop-label, .shop-value { color: black !important; }
      .products-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 10px;
      }
      .stats {
        grid-template-columns: repeat(4, 1fr) !important;
      }
      .stat-card .value { color: black !important; }
      .category-value-item { background: #f5f5f5 !important; }
      .category-value-item .name { color: black !important; }
      .category-value-item .amount { color: #047857 !important; }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- HEADER -->
    <div class="header">
      <div class="header-top">
        <div class="header-title">
          <div class="logo">📱</div>
          <h1>
            ONE MOBILE
            <span>ستوك المحل</span>
          </h1>
        </div>
        <div class="header-buttons">
          <button class="btn btn-primary" onclick="loadData()">🔄 تحديث</button>
          <button class="btn btn-success" onclick="window.print()">🖨️ طباعة</button>
          <button class="btn btn-warning" onclick="downloadPDF()">📄 PDF</button>
        </div>
      </div>
      <div class="last-update" id="lastUpdate">جاري التحميل...</div>

      <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍   ابحث عن منتج..." />
      </div>

      <div class="price-filter">
        <label>💰 السعر من:</label>
        <input type="number" id="minPrice" placeholder="0" />
        <label>إلى:</label>
        <input type="number" id="maxPrice" placeholder="∞" />
        <button class="clear-filter-btn" onclick="clearPriceFilter()">✖️ مسح</button>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-filter="all">
          الكل <span class="tab-count" id="count-all">0</span>
        </button>
        <button class="tab-btn" data-filter="iphone">
          📱 iPhone <span class="tab-count" id="count-iphone">0</span>
        </button>
        <button class="tab-btn" data-filter="ipad">
          📋 iPad <span class="tab-count" id="count-ipad">0</span>
        </button>
        <button class="tab-btn" data-filter="macbook">
          💻 MacBook <span class="tab-count" id="count-macbook">0</span>
        </button>
        <button class="tab-btn" data-filter="accessories">
          🎧 إكسسوارات <span class="tab-count" id="count-accessories">0</span>
        </button>
      </div>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat-card total">
        <div class="icon">📦</div>
        <h3>إجمالي القطع</h3>
        <div class="value" id="totalQty">0</div>
      </div>
      <div class="stat-card up">
        <div class="icon">⬆️</div>
        <h3>المحل اللي فوق</h3>
        <div class="value" id="upQty">0</div>
      </div>
      <div class="stat-card down">
        <div class="icon">⬇️</div>
        <h3>المحل اللي تحت</h3>
        <div class="value" id="downQty">0</div>
      </div>
      <div class="stat-card types">
        <div class="icon">🏷️</div>
        <h3>عدد الموديلات</h3>
        <div class="value" id="typesQty">0</div>
      </div>
      <div class="stat-card value-card">
        <div class="icon">💰</div>
        <h3>قيمة الستوك الكلية</h3>
        <div class="value" id="totalValue">0</div>
      </div>
    </div>

    <!-- CATEGORY VALUES -->
    <div class="category-values">
      <h3>💎 قيمة كل قسم</h3>
      <div class="category-grid" id="categoryValues"></div>
    </div>

    <!-- PRODUCTS -->
    <div id="productsGrid" class="products-grid">
      <div class="loading">
        <div class="spinner"></div>
        <p>جاري تحميل الستوك...</p>
      </div>
    </div>

  </div>

  <!-- PDF Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.0/jspdf.plugin.autotable.min.js"></script>

  <script>
    // ============================================
    //   ضع رابط Google Apps Script هنا
    // ============================================
    const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbwqrE5U8e1QOYfaeH9IWAaoh7jPHFAHxF_qD2i8vyQwnfhvrg2CaHHvNHXOsZ8r2IIo/exec";

    let allProducts = [];
    let currentFilter = "all";

    function detectCategory(name) {
      const n = name.toLowerCase();
      if (n.includes("iphone")) return "iphone";
      if (n.includes("ipad")) return "ipad";
      if (n.includes("macbook")) return "macbook";
      return "accessories";
    }

    function getCategoryIcon(cat) {
      if (cat === "iphone") return "📱";
      if (cat === "ipad") return "📋";
      if (cat === "macbook") return "💻";
      return "🎧";
    }

    function getCategoryText(cat) {
      if (cat === "iphone") return "iPhone";
      if (cat === "ipad") return "iPad";
      if (cat === "macbook") return "MacBook";
      return "إكسسوارات";
    }

    function cleanName(name) {
      return name.replace(/\*/g, "").replace(/\s+/g, " ").trim();
    }

    function formatPrice(price) {
      if (!price || price === 0) return "غير محدد";
      return parseInt(price).toLocaleString("en-US") + " ج";
    }

    async function loadData() {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = `
        <div class="loading">
          <div class="spinner"></div>
          <p>جاري تحميل الستوك...</p>
        </div>
      `;

      try {
        const response = await fetch(SHEET_API_URL);
        const data = await response.json();

        allProducts = data.map(item => ({
          name: cleanName(item.name),
          rawName: item.name,
          category: detectCategory(item.name),
          shopUp: item.shopUp,
          shopDown: item.shopDown,
          total: item.total,
          price: item.price || 0
        }));

        const now = new Date();
        document.getElementById("lastUpdate").textContent =
          "آخر تحديث: " + now.toLocaleTimeString("ar-EG", {hour: '2-digit', minute:'2-digit'}) +
          " - " + now.toLocaleDateString("ar-EG");

        updateStats();
        updateCategoryValues();
        updateTabCounts();
        renderProducts();

      } catch (error) {
        grid.innerHTML = `
          <div class="error-state">
            <div class="icon">😵</div>
            <h3>حصل مشكلة في تحميل البيانات</h3>
            <p>تأكد من اتصال الإنترنت ومن رابط الشيت</p>
            <button class="retry-btn" onclick="loadData()">🔄 حاول تاني</button>
          </div>
        `;
      }
    }

    function updateStats() {
      const totalUp = allProducts.reduce((sum, p) => sum + p.shopUp, 0);
      const totalDown = allProducts.reduce((sum, p) => sum + p.shopDown, 0);
      const totalAll = allProducts.reduce((sum, p) => sum + p.total, 0);
      const totalValue = allProducts.reduce((sum, p) => sum + (p.total * p.price), 0);

      document.getElementById("totalQty").textContent = totalAll;
      document.getElementById("upQty").textContent = totalUp;
      document.getElementById("downQty").textContent = totalDown;
      document.getElementById("typesQty").textContent = allProducts.length;
      document.getElementById("totalValue").textContent = 
        totalValue.toLocaleString("en-US") + " ج";
    }

    function updateCategoryValues() {
      const categories = ["iphone", "ipad", "macbook", "accessories"];
      const container = document.getElementById("categoryValues");
      container.innerHTML = "";

      categories.forEach(cat => {
        const items = allProducts.filter(p => p.category === cat);
        const value = items.reduce((sum, p) => sum + (p.total * p.price), 0);
        const qty = items.reduce((sum, p) => sum + p.total, 0);

        const div = document.createElement("div");
        div.className = "category-value-item";
        div.innerHTML = `
          <div>
            <div class="name">${getCategoryIcon(cat)} ${getCategoryText(cat)}</div>
            <div style="color: #64748b; font-size: 11px; margin-top: 2px;">${qty} قطعة</div>
          </div>
          <div class="amount">${value.toLocaleString("en-US")} ج</div>
        `;
        container.appendChild(div);
      });
    }

    function updateTabCounts() {
      document.getElementById("count-all").textContent = allProducts.length;
      document.getElementById("count-iphone").textContent =
        allProducts.filter(p => p.category === "iphone").length;
      document.getElementById("count-ipad").textContent =
        allProducts.filter(p => p.category === "ipad").length;
      document.getElementById("count-macbook").textContent =
        allProducts.filter(p => p.category === "macbook").length;
      document.getElementById("count-accessories").textContent =
        allProducts.filter(p => p.category === "accessories").length;
    }

    function renderProducts() {
      const grid = document.getElementById("productsGrid");
      const searchValue = document.getElementById("searchInput").value.toLowerCase();
      const minPrice = parseInt(document.getElementById("minPrice").value) || 0;
      const maxPrice = parseInt(document.getElementById("maxPrice").value) || Infinity;

      let filtered = allProducts.filter(product => {
        const matchCategory =
          currentFilter === "all" || product.category === currentFilter;

        const matchSearch =
          product.name.toLowerCase().includes(searchValue) ||
          product.rawName.toLowerCase().includes(searchValue);

        const matchPrice = 
          product.price >= minPrice && product.price <= maxPrice;

        return matchCategory && matchSearch && matchPrice;
      });

      filtered.sort((a, b) => b.total - a.total);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">🔍</div>
            <h3>مفيش نتائج</h3>
            <p>جرب تبحث بكلمة تانية أو غيّر فلتر السعر</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = "";

      filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product-card";
        if (product.total === 0) card.classList.add("out-stock");

        const priceClass = product.price > 0 ? "" : "no-price";

        card.innerHTML = `
          <div class="product-header">
            <div style="flex: 1;">
              <div class="product-name">${product.name}</div>
              <div class="product-category">
                ${getCategoryIcon(product.category)} ${getCategoryText(product.category)}
              </div>
            </div>
            <div class="total-badge ${product.total === 0 ? 'zero' : ''}">
              ${product.total}
            </div>
          </div>

          <div class="price-tag ${priceClass}">
            💰 ${formatPrice(product.price)}
          </div>

          <div class="shops">
            <div class="shop">
              <div class="shop-label">⬆️ المحل اللي فوق</div>
              <div class="shop-value ${product.shopUp > 0 ? 'has' : 'empty'}">
                ${product.shopUp}
              </div>
            </div>
            <div class="shop">
              <div class="shop-label">⬇️ المحل اللي تحت</div>
              <div class="shop-value ${product.shopDown > 0 ? 'has' : 'empty'}">
                ${product.shopDown}
              </div>
            </div>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function clearPriceFilter() {
      document.getElementById("minPrice").value = "";
      document.getElementById("maxPrice").value = "";
      renderProducts();
    }

    // ===== PDF =====
    function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      const now = new Date();
      const dateStr = now.toLocaleDateString("en-GB") + " " + 
                      now.toLocaleTimeString("en-GB", {hour: '2-digit', minute:'2-digit'});

      // Header
      doc.setFontSize(18);
      doc.setTextColor(59, 130, 246);
      doc.text("ONE MOBILE - Stock Report", 14, 18);
      
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text("Date: " + dateStr, 14, 25);

      // Stats
      const totalAll = allProducts.reduce((sum, p) => sum + p.total, 0);
      const totalValue = allProducts.reduce((sum, p) => sum + (p.total * p.price), 0);
      
      doc.setFontSize(11);
      doc.setTextColor(0);
      doc.text(`Total Items: ${totalAll}`, 14, 33);
      doc.text(`Total Models: ${allProducts.length}`, 70, 33);
      doc.text(`Total Value: ${totalValue.toLocaleString("en-US")} EGP`, 130, 33);

      // Table
      const rows = allProducts.map(p => [
        p.name,
        getCategoryText(p.category),
        p.shopUp,
        p.shopDown,
        p.total,
        p.price > 0 ? p.price.toLocaleString("en-US") : "-",
        p.price > 0 ? (p.price * p.total).toLocaleString("en-US") : "-"
      ]);

      doc.autoTable({
        startY: 38,
        head: [['Product', 'Category', 'Up', 'Down', 'Total', 'Price', 'Value']],
        body: rows,
        styles: { fontSize: 8, cellPadding: 2 },
        headStyles: { fillColor: [59, 130, 246] },
        columnStyles: {
          0: { cellWidth: 70 },
          1: { cellWidth: 25 },
          2: { cellWidth: 12, halign: 'center' },
          3: { cellWidth: 12, halign: 'center' },
          4: { cellWidth: 14, halign: 'center' },
          5: { cellWidth: 22, halign: 'right' },
          6: { cellWidth: 25, halign: 'right' }
        }
      });

      doc.save(`OneMobile_Stock_${now.toISOString().split('T')[0]}.pdf`);
    }

    // ===== Events =====
    document.querySelectorAll(".tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.dataset.filter;
        renderProducts();
      });
    });

    document.getElementById("searchInput").addEventListener("input", renderProducts);
    document.getElementById("minPrice").addEventListener("input", renderProducts);
    document.getElementById("maxPrice").addEventListener("input", renderProducts);

    loadData();
    setInterval(loadData, 3 * 60 * 1000);

    // ===== PWA Service Worker =====
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('SW registered'))
          .catch(err => console.log('SW failed'));
      });
    }
  </script>
</body>
</html>
